<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Resume Builder: match score, tailored resume and cover letter</title>
    <meta
      name="description"
      content="Free, open-source resume tool. Check how well your resume matches a job post, fix weak bullet points, and get a tailored resume, a cover letter and interview questions. Nothing is stored."
    />
    <meta name="theme-color" content="#2563eb" />
    <meta property="og:title" content="AI Resume Builder" />
    <meta
      property="og:description"
      content="Match score, resume review, tailored resume, cover letter and interview prep. Open source; nothing is stored."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='41' font-family='Arial,sans-serif' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3EAR%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Apply a saved light/dark choice before the page paints, so it never flashes.
      try {
        const theme = JSON.parse(localStorage.getItem("ai-resume-builder:theme"));
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
