# One-click deploy of the full app (API + React page) on Render's free plan.
# Render → New → Blueprint → pick this repository. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: ai-resume-builder
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # "mock" runs the match score, review, bullet coach, interview prep and
      # template cover letters with no AI model. Set "openai" plus the LLM_*
      # values below to turn on AI rewriting and AI cover letters.
      - key: LLM_PROVIDER
        value: mock
      # - key: LLM_BASE_URL
      #   value: https://your-provider.example/v1
      # - key: LLM_MODEL
      #   value: your-model-name
      # - key: LLM_API_KEY
      #   sync: false   # enter it in the Render dashboard, never in this file
      # Render sits in front of the app, so use the visitor address it forwards.
      - key: TRUST_PROXY
        value: "1"
