name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please use a made-up resume. Never paste a real person's resume or contact details.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Click Try a sample\n2. ..."
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Live demo (GitHub Pages)
        - Self-hosted with Docker
        - Local development
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
